<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陽光社區・獨立生活認證挑戰</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Three.js r128 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 Google Fonts: Noto Sans TC 確保繁體中文高度易讀 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Noto Sans TC', sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        /* 自訂滾動條，讓平板與白板操作更順暢 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 選項按鈕特教友善防誤觸與高對比過渡動畫 */
        .option-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }
        .option-btn:active:not(:disabled) {
            transform: scale(0.985);
        }
        .option-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        /* 分數浮動加減特效 */
        @keyframes floatScore {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-28px) scale(1.15); }
        }
        .score-float {
            animation: floatScore 1.2s ease-out forwards;
        }
        /* 3D 畫布自適應 */
        #three-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col lg:flex-row bg-slate-100 text-slate-800 select-none">

    <!-- 左側 60%：3D 社區場景視窗 -->
    <div id="left-viewport" class="relative w-full lg:w-[60%] h-[42vh] lg:h-full bg-sky-200 overflow-hidden shadow-inner flex-shrink-0">
        <!-- Three.js 渲染容器 -->
        <div id="three-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- 左上角：禮儀分數與關卡進度資訊卡 -->
        <div class="absolute top-3 left-3 sm:top-4 sm:left-4 z-10 flex flex-wrap items-center gap-2 sm:gap-3 pointer-events-none">
            <!-- 禮儀分數徽章 -->
            <div class="relative bg-white/95 backdrop-blur-md border-2 border-amber-400 rounded-2xl px-3.5 py-2 sm:px-4 sm:py-2.5 shadow-lg flex items-center gap-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl sm:text-2xl font-black">
                    ★
                </div>
                <div>
                    <div class="text-xs font-bold text-slate-500 tracking-wide">禮儀認證分數</div>
                    <div class="flex items-baseline gap-1">
                        <span id="score-display" class="text-2xl sm:text-3xl font-black text-amber-600">0</span>
                        <span class="text-xs sm:text-sm font-bold text-slate-400">/ 100 分</span>
                    </div>
                </div>
                <!-- 浮動加減分提示容器 -->
                <div id="score-float-container" class="absolute -bottom-6 right-2 pointer-events-none"></div>
            </div>

            <!-- 當前場所標籤 -->
            <div class="bg-slate-900/80 backdrop-blur-md text-white rounded-2xl px-3.5 py-2 sm:px-4 sm:py-2.5 shadow-lg border border-white/15">
                <div class="text-[11px] sm:text-xs text-sky-300 font-bold" id="scene-subtitle">準備出發</div>
                <div class="text-sm sm:text-base font-black tracking-wide" id="scene-title">陽光社區大門</div>
            </div>
        </div>

        <!-- 右上角：三個懸浮功能按鈕（任務清單/禮儀小卡、語音靜音切換、回首頁確認） -->
        <div class="absolute top-3 right-3 sm:top-4 sm:right-4 z-10 flex items-center gap-2">
            <!-- 任務清單 / 禮儀小卡 -->
            <button id="btn-mission-card" onclick="toggleMissionModal(true)" title="任務清單與禮儀小卡"
                class="bg-white/95 hover:bg-amber-50 active:scale-95 text-slate-800 border-2 border-slate-200 hover:border-amber-400 rounded-2xl p-2.5 sm:px-3.5 sm:py-2.5 shadow-lg flex items-center gap-1.5 font-bold text-sm transition">
                <span class="text-lg sm:text-xl">📋</span>
                <span class="hidden sm:inline">禮儀小卡</span>
            </button>

            <!-- 語音朗讀靜音切換 -->
            <button id="btn-mute-toggle" onclick="toggleMute()" title="切換語音朗讀與音效"
                class="bg-white/95 hover:bg-sky-50 active:scale-95 text-slate-800 border-2 border-slate-200 hover:border-sky-400 rounded-2xl p-2.5 sm:px-3.5 sm:py-2.5 shadow-lg flex items-center gap-1.5 font-bold text-sm transition">
                <span id="mute-icon" class="text-lg sm:text-xl">🔊</span>
                <span id="mute-label" class="hidden sm:inline">語音開啟</span>
            </button>

            <!-- 回首頁確認按鈕 -->
            <button id="btn-home-confirm" onclick="toggleHomeModal(true)" title="回到首頁"
                class="bg-white/95 hover:bg-rose-50 active:scale-95 text-slate-800 border-2 border-slate-200 hover:border-rose-400 rounded-2xl p-2.5 sm:px-3.5 sm:py-2.5 shadow-lg flex items-center gap-1.5 font-bold text-sm transition">
                <span class="text-lg sm:text-xl">🏠</span>
                <span class="hidden sm:inline">回首頁</span>
            </button>
        </div>

        <!-- 底部操作提示條（視角拖曳與第一關建築點擊引導） -->
        <div id="scene-hint-banner" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-10 bg-slate-900/80 backdrop-blur-md text-white text-xs sm:text-sm font-bold px-4 py-2 rounded-full shadow-lg border border-white/20 whitespace-nowrap flex items-center gap-2">
            <span>👆 可拖曳畫面旋轉視角</span>
            <span id="interactive-3d-tip" class="hidden text-amber-300 font-black">・請點擊 3D 建築或右側按鈕</span>
        </div>
    </div>

    <!-- 右側 40%：任務分析控制面板 -->
    <div id="right-panel" class="w-full lg:w-[40%] h-[58vh] lg:h-full bg-white border-t-4 lg:border-t-0 lg:border-l-4 border-slate-200 flex flex-col justify-between overflow-hidden shadow-2xl">
        
        <!-- 頂部：5 大關卡水平進度膠囊列 -->
        <div class="bg-slate-50 border-b border-slate-200 px-3 py-2.5 sm:px-5 sm:py-3 flex-shrink-0">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-extrabold text-slate-500 tracking-wider uppercase">獨立生活認證進度</span>
                <span id="mode-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">學習模式</span>
            </div>
            <div id="stage-pills" class="flex items-center gap-1.5 overflow-x-auto pb-1">
                <!-- 由 JS 動態生成 5 個關卡膠囊 -->
            </div>
        </div>

        <!-- 中央主內容區：對話框、大字體題目、大型觸控選項按鈕、回饋提示區 -->
        <div id="control-scroll-area" class="flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-5 space-y-4">
            
            <!-- NPC 對話氣泡與語音重聽喇叭按鈕 -->
            <div id="npc-dialogue-box" class="bg-amber-50/90 border-2 border-amber-300 rounded-2xl p-3.5 sm:p-4 shadow-sm relative">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                    <div class="flex items-center gap-2">
                        <span id="npc-avatar-emoji" class="text-2xl bg-white rounded-xl w-9 h-9 flex items-center justify-center shadow-sm border border-amber-200">🧑</span>
                        <div>
                            <div id="npc-name" class="font-black text-amber-900 text-base sm:text-lg leading-tight">社區小幫手「德哥」</div>
                            <div id="npc-role" class="text-xs font-bold text-amber-700">親切學長導覽員</div>
                        </div>
                    </div>
                    <!-- 顯眼的語音重聽喇叭按鈕 -->
                    <button id="btn-replay-speech" onclick="replayCurrentSpeech()"
                        class="bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold text-xs sm:text-sm px-3 py-2 rounded-xl shadow flex items-center gap-1.5 transition flex-shrink-0">
                        <span class="text-base">🔊</span>
                        <span>重聽語音</span>
                    </button>
                </div>
                <p id="npc-text" class="text-slate-800 text-base sm:text-lg font-medium leading-relaxed mt-1">
                    歡迎參加《陽光社區・獨立生活認證挑戰》！
                </p>
            </div>

            <!-- 學習模式專屬：禮儀小訣竅提示卡 -->
            <div id="learning-tip-box" class="hidden bg-sky-50 border-2 border-sky-300 rounded-2xl p-3.5 text-sky-900 text-sm sm:text-base font-bold flex items-start gap-2.5">
                <span class="text-xl flex-shrink-0">💡</span>
                <div>
                    <div class="text-xs font-black text-sky-600 uppercase mb-0.5">學習模式・禮儀小訣竅</div>
                    <div id="learning-tip-text">觀察環境標示，保持禮貌與安全距離。</div>
                </div>
            </div>

            <!-- 情境與大字體題目區（18px - 28px） -->
            <div id="question-section" class="space-y-2">
                <div id="scenario-badge" class="inline-block bg-indigo-100 text-indigo-800 text-xs sm:text-sm font-extrabold px-3 py-1 rounded-lg">
                    任務情境
                </div>
                <h2 id="question-title" class="text-xl sm:text-2xl font-black text-slate-900 leading-snug">
                    準備好開始獨立生活認證挑戰了嗎？
                </h2>
            </div>

            <!-- 互動回饋提示框（答對鼓勵或答錯正向引導） -->
            <div id="feedback-box" class="hidden rounded-2xl p-4 border-2 font-bold text-base sm:text-lg leading-relaxed shadow-sm transition-all">
                <div class="flex items-start gap-2.5">
                    <span id="feedback-icon" class="text-2xl flex-shrink-0">🌟</span>
                    <div id="feedback-text" class="flex-1"></div>
                </div>
            </div>

            <!-- 大型高對比觸控選項按鈕區（高度 >= 56px） -->
            <div id="options-container" class="space-y-3 pt-1 pb-4">
                <!-- 由 JS 動態生成大型選項按鈕 -->
            </div>

        </div>

        <!-- 底部：可折疊「老師設定 (▶ 老師設定)」面板 -->
        <div class="border-t-2 border-slate-200 bg-slate-50 flex-shrink-0">
            <button id="btn-teacher-toggle" onclick="toggleTeacherPanel()"
                class="w-full px-4 py-2.5 sm:px-5 sm:py-3 flex items-center justify-between text-left font-extrabold text-slate-700 hover:bg-slate-100 transition text-sm sm:text-base">
                <span class="flex items-center gap-2">
                    <span id="teacher-arrow" class="inline-block transition-transform duration-200">▶</span>
                    <span>老師設定（模式切換 / 跳關測試 / 語速調整）</span>
                </span>
                <span class="text-xs font-bold text-slate-400">教學輔助</span>
            </button>

            <div id="teacher-panel-body" class="hidden px-4 pb-4 pt-1 sm:px-5 space-y-3 border-t border-slate-200 bg-white max-h-60 overflow-y-auto">
                <!-- 1. 教學模式切換 -->
                <div>
                    <label class="block text-xs font-black text-slate-500 mb-1.5">1. 輔助模式切換</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="setGameMode('learning')" id="mode-btn-learning"
                            class="py-2 px-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition bg-emerald-600 text-white border-emerald-600">
                            學習模式<br><span class="text-[11px] font-normal opacity-90">顯示提示卡</span>
                        </button>
                        <button onclick="setGameMode('practice')" id="mode-btn-practice"
                            class="py-2 px-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition bg-white text-slate-700 border-slate-300 hover:border-sky-400">
                            練習模式<br><span class="text-[11px] font-normal opacity-75">答錯給提示</span>
                        </button>
                        <button onclick="setGameMode('challenge')" id="mode-btn-challenge"
                            class="py-2 px-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition bg-white text-slate-700 border-slate-300 hover:border-amber-400">
                            挑戰模式<br><span class="text-[11px] font-normal opacity-75">無提示+隨機</span>
                        </button>
                    </div>
                </div>

                <!-- 2. 語音朗讀語速調整 -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="speech-rate-slider" class="text-xs font-black text-slate-500">2. 語音朗讀速度 (zh-TW)</label>
                        <span id="speech-rate-val" class="text-xs font-black text-sky-600">0.95x（適中）</span>
                    </div>
                    <input id="speech-rate-slider" type="range" min="0.7" max="1.2" step="0.05" value="0.95"
                        oninput="updateSpeechRate(this.value)"
                        class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-sky-600">
                </div>

                <!-- 3. 直接跳關測試 -->
                <div>
                    <label class="block text-xs font-black text-slate-500 mb-1.5">3. 直接跳關測試</label>
                    <div class="flex flex-wrap gap-1.5">
                        <button onclick="jumpToStep(0)" class="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">開場</button>
                        <button onclick="jumpToStep(2)" class="px-2.5 py-1.5 rounded-lg bg-sky-100 hover:bg-sky-200 text-xs font-bold text-sky-800">1.便利商店</button>
                        <button onclick="jumpToStep(5)" class="px-2.5 py-1.5 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-xs font-bold text-emerald-800">2.社區藥局</button>
                        <button onclick="jumpToStep(8)" class="px-2.5 py-1.5 rounded-lg bg-rose-100 hover:bg-rose-200 text-xs font-bold text-rose-800">3.台灣夜市</button>
                        <button onclick="jumpToStep(10)" class="px-2.5 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-xs font-bold text-amber-800">4.巷口麵店</button>
                        <button onclick="jumpToStep(12)" class="px-2.5 py-1.5 rounded-lg bg-teal-100 hover:bg-teal-200 text-xs font-bold text-teal-800">5.社區公園</button>
                        <button onclick="jumpToStep(14)" class="px-2.5 py-1.5 rounded-lg bg-purple-100 hover:bg-purple-200 text-xs font-bold text-purple-800">結算認證</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 彈窗 1：任務清單與禮儀小卡 Modal -->
    <div id="mission-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border-4 border-amber-300 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">📋</span>
                    <h3 class="text-xl font-black text-slate-900">獨立生活任務清單與禮儀小卡</h3>
                </div>
                <button onclick="toggleMissionModal(false)" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 font-black text-slate-600 text-lg">✕</button>
            </div>
            <div id="mission-modal-content" class="space-y-3 text-slate-700 text-base leading-relaxed max-h-[60vh] overflow-y-auto">
                <!-- 由 JS 動態填入當前任務與五大禮儀原則 -->
            </div>
            <button onclick="toggleMissionModal(false)" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-black text-lg shadow-md">
                我知道了，繼續挑戰！
            </button>
        </div>
    </div>

    <!-- 彈窗 2：回首頁確認 Modal -->
    <div id="home-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-rose-300 space-y-4 text-center">
            <div class="text-5xl">🏠</div>
            <h3 class="text-2xl font-black text-slate-900">確定要回到首頁嗎？</h3>
            <p class="text-slate-600 text-base font-medium">回到首頁將會重新開始挑戰，目前的分數與關卡進度會歸零喔！</p>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="toggleHomeModal(false)" class="py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-lg">
                    繼續挑戰
                </button>
                <button onclick="resetToHome()" class="py-3.5 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white font-black text-lg shadow">
                    確定回首頁
                </button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. 遊戲劇本與 10 題核心禮儀數據定義（完整還原所有對話、選項與計分規則）
        // =========================================================================
        const STAGES = [
            { id: 1, short: "1.便利商店", name: "第一關：便利商店", mission: "購買午餐飯糰與繳交電費，並遵守排隊禮儀。" },
            { id: 2, short: "2.社區藥局", name: "第二關：社區藥局", mission: "拿處方箋領藥與買 OK 繃，不隨意拿取或拆封商品。" },
            { id: 3, short: "3.台灣夜市", name: "第三關：台灣夜市", mission: "買一杯珍珠奶茶，注意夜市排隊動線與邊走邊吃禮儀。" },
            { id: 4, short: "4.巷口麵店", name: "第四關：巷口早餐店與麵店", mission: "找乾淨座位並畫單點餐，注意內用音量與餐具節約。" },
            { id: 5, short: "5.社區公園", name: "第五關：社區公園", mission: "喝完飲料做好垃圾分類，並選擇適合年齡的運動器材。" }
        ];

        // 步驟索引對應完整流程：
        // 0: 開場畫面一（社區大門前）
        // 1: 開場畫面二（規則簡報）
        // 2: 第一關 - 場所辨識觸發點（街道門口）
        // 3: 第一關 - 選擇題 1（排隊位置） [scoredQ: 1]
        // 4: 第一關 - 選擇題 2（突發狀況處理） [scoredQ: 2]
        // 5: 第二關 - 選擇題 3（商品拿取規範） [scoredQ: 3]
        // 6: 第二關 - 藥師諮詢對話（非計分題，但答錯扣5分引導重選）
        // 7: 第二關 - 選擇題 4（場所功能確認） [scoredQ: 4]
        // 8: 第三關 - 選擇題 5（夜市排隊與動線） [scoredQ: 5]
        // 9: 第三關 - 選擇題 6（不隨意拿取與邊走邊吃禮儀） [scoredQ: 6]
        // 10: 第四關 - 選擇題 7（內用入座與點餐流程） [scoredQ: 7]
        // 11: 第四關 - 選擇題 8（餐飲場所禮儀） [scoredQ: 8]
        // 12: 第五關 - 選擇題 9（公園環境禮儀） [scoredQ: 9]
        // 13: 第五關 - 選擇題 10（設施年齡限制與社交禮儀） [scoredQ: 10]
        // 14: 五關全破結算總評（導覽員：阿凱）

        const GAME_STEPS = [
            // --- 0: 畫面一：社區大門前 ---
            {
                stepId: 0,
                stageIndex: 0,
                sceneKey: "gate",
                sceneTitle: "陽光社區大門",
                sceneSubtitle: "開場導覽・畫面一",
                npcName: "社區小幫手「德哥」",
                npcRole: "親切學長導覽員",
                npcEmoji: "🧑",

        // =========================================================================

        let audioCtx = null;

        function ensureAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {

            }

        // 播放溫和清脆鼓勵音效（上升大三和弦風鈴聲）
        function playSuccessSound() {
            if (gameState.isMuted) return;
            try {
                ensureAudioContext();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.09);

                    gain.gain.setValueAtTime(0.001, now + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.09 + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.09 + 0.45);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.09);
                    osc.stop(now + idx * 0.09 + 0.46);
                });
            } catch (e) {
                console.warn("音效播放略過:", e);
            }
        }

        function speakText(text) {
            lastSpokenText = text;
            if (gameState.isMuted) return;
            if (!('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                // 清理括號內輔助符號讓朗讀更自然流暢
                const cleanText = text.replace(/[「」『』（）\(\)★]/g, ' ');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-TW';
                utterance.rate = gameState.speechRate;
                utterance.pitch = 1.05;

                // 優先挑選台灣國語語音
                const voices = window.speechSynthesis.getVoices();
                const twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh_TW'));
                if (twVoice) {
                    utterance.voice = twVoice;
                }
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("語音朗讀不可用:", e);
            }
        }

        function toggleMute(forceState) {

            const icon = document.getElementById('mute-icon');

                icon.textContent = '🔇';

            } else {
                icon.textContent = '🔊';
                label.textContent = '語音開啟';
            }
        }

            else if (gameState.speechRate >= 1.1) desc = "稍快";
            document.getElementById('speech-rate-val').textContent = `${gameState.speechRate.toFixed(2)}x（${desc}）`;

        // =========================================================================

        // =========================================================================
        let scene, camera, renderer, sceneGroup;
        let interactiveMeshes = []; // 儲存可點擊的 3D 物件（如第一關街道三棟建築）
        let animatedCharacters = []; // 儲存需要呼吸/揮手動畫的 3D 角色
        let cameraAngle = { theta: 0, phi: 0.32, radius: 16, targetY: 2.2 };
        let isDraggingCamera = false;
        let prevMouse = { x: 0, y: 0 };
        let raycaster = new THREE.Raycaster();
        let mouseVec = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdbeafe);
            scene.fog = new THREE.FogExp2(0xdbeafe, 0.016);

            camera = new THREE.PerspectiveCamera(46, container.clientWidth / container.clientHeight, 0.1, 200);
            updateCameraPosition();

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 明亮溫馨的太陽與環境光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
            dirLight.position.set(14, 24, 16);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 2;
            dirLight.shadow.camera.far = 60;
            const d = 22;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            sceneGroup = new THREE.Group();
            scene.add(sceneGroup);

            // 綁定視角拖曳與點擊互動（支援滑鼠與觸控）
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        function updateCameraPosition() {
            if (!camera) return;
            const x = cameraAngle.radius * Math.sin(cameraAngle.theta) * Math.cos(cameraAngle.phi);
            const y = cameraAngle.targetY + cameraAngle.radius * Math.sin(cameraAngle.phi);
            const z = cameraAngle.radius * Math.cos(cameraAngle.theta) * Math.cos(cameraAngle.phi);
            camera.position.set(x, Math.max(2.5, y), z);
            camera.lookAt(0, cameraAngle.targetY, 0);
        }

        function onPointerDown(e) {
            isDraggingCamera = true;
            prevMouse = { x: e.clientX, y: e.clientY };
            pointerDownPos = { x: e.clientX, y: e.clientY };
        }

        function onPointerMove(e) {
            if (!isDraggingCamera) return;
            const dx = e.clientX - prevMouse.x;
            const dy = e.clientY - prevMouse.y;
            prevMouse = { x: e.clientX, y: e.clientY };

            cameraAngle.theta -= dx * 0.008;
            // 限制水平旋轉角度於正面 -55度 ~ +55度，避免轉到建築物背面迷失方向
            cameraAngle.theta = Math.max(-0.95, Math.min(0.95, cameraAngle.theta));
            cameraAngle.phi = Math.max(0.15, Math.min(0.75, cameraAngle.phi + dy * 0.006));
            updateCameraPosition();
        }

        function onPointerUp(e) {
            if (!isDraggingCamera) return;
            isDraggingCamera = false;

            // 判斷是否為點擊（位移小於 8px）
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dist < 8 && interactiveMeshes.length > 0) {
                const container = document.getElementById('three-container');
                const rect = container.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(mouseVec, camera);
                    const intersects = raycaster.intersectObjects(interactiveMeshes, true);
                    if (intersects.length > 0) {
                        let obj = intersects[0].object;
                        while (obj && !obj.userData.buildingId) {
                            obj = obj.parent;
                        }
                        if (obj && obj.userData.buildingId) {
                            handle3DBuildingClick(obj.userData.buildingId);
                        }
                    }
                }
            }
        }

        function onWindowResize() {
            const container = document.getElementById('three-container');
            if (!container || !renderer || !camera) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // 建立文字貼圖看板輔助函式（讓 3D 場景中的台灣招牌一目瞭然）
        function createSignTexture(text, bgColor, textColor, borderColor = null, subText = "") {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 512, 192);

            if (borderColor) {
                ctx.strokeStyle = borderColor;
                ctx.lineWidth = 16;
                ctx.strokeRect(8, 8, 496, 176);
            }

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '900 54px "Noto Sans TC", sans-serif';
            ctx.fillText(text, 256, subText ? 74 : 96);

            if (subText) {
                ctx.font = '700 32px "Noto Sans TC", sans-serif';
                ctx.fillText(subText, 256, 140);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        // 建立親切的低多邊形 (Low-Poly) 3D 人物模型

            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.set(0, 1.55, 0);

            // 圍裙（店員/老闆）

                const apronGeo = new THREE.BoxGeometry(0.56, 0.95, 0.12);
                const apronMat = new THREE.MeshLambertMaterial({ color: apronColor });
                const apron = new THREE.Mesh(apronGeo, apronMat);

            const head = new THREE.Mesh(headGeo, headMat);
            head.position.set(0, 2.48, 0);

            person.add(head);

            // 頭髮（半圓帽狀）

            const hairMat = new THREE.MeshLambertMaterial({ color: hairColor });
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.set(0, 2.52, -0.02);
            hair.rotation.x = -0.15;

            // 眼睛（親切大眼）

            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.12, 2.48, 0.33);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.12, 2.48, 0.33);
            person.add(eyeL, eyeR);

            // 手臂
            const armGeo = new THREE.CylinderGeometry(0.11, 0.1, 0.9, 8);
            const armMat = new THREE.MeshLambertMaterial({ color: isWhiteCoat ? 0xffffff : shirtColor });

            const leftArm = new THREE.Mesh(armGeo, armMat);
            leftArm.position.set(-0.48, 1.55, 0);
            leftArm.rotation.z = 0.15;
            person.add(leftArm);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.48, 1.95, 0);
            const rightArm = new THREE.Mesh(armGeo, armMat);
            rightArm.position.set(0, -0.4, 0);
            rightArmPivot.add(rightArm);
            person.add(rightArmPivot);

            person.scale.set(scale, scale, scale);
            person.userData.rightArmPivot = rightArmPivot;
            person.userData.waveArm = waveArm;
            person.userData.baseY = 0;
            animatedCharacters.push(person);
            return person;
        }

        function createLowPolyTree(x, z, scale = 1) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.35, 1.6, 7),
                new THREE.MeshLambertMaterial({ color: 0x78350f })
            );
            trunk.position.y = 0.8;
            trunk.castShadow = true;
            tree.add(trunk);

            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });
            const c1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.25, 0), leavesMat);
            c1.position.y = 2.3;
            c1.castShadow = true;
            const c2 = new THREE.Mesh(new THREE.DodecahedronGeometry(0.95, 0), new THREE.MeshLambertMaterial({ color: 0x4ade80 }));
            c2.position.set(0.4, 3.1, 0.2);
            tree.add(c1, c2);

            tree.position.set(x, 0, z);
            tree.scale.set(scale, scale, scale);
            return tree;
        }

                    new THREE.BoxGeometry(2.6, 0.85, 0.15),

                );
                binSign.position.set(-0.95, 2.0, -1.5);
                sceneGroup.add(binGeneral, binRecycle, binSign);

                // 兒童溜滑梯區（限 12 歲以下）
                const slideTower = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.4, 1.6), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
                slideTower.position.set(3.5, 1.2, -3.0);
                const slideRamp = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.2, 3.0), new THREE.MeshLambertMaterial({ color: 0xf43f5e }));
                slideRamp.position.set(3.5, 1.1, -1.2);
                slideRamp.rotation.x = 0.65;
                sceneGroup.add(slideTower, slideRamp);

                // 成人健走器（黃藍配色）
                const walkerBase = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.5, 1.2), new THREE.MeshLambertMaterial({ color: 0x0ea5e9 }));
                walkerBase.position.set(7.2, 1.25, -2.5);
                sceneGroup.add(walkerBase);

                // 運動阿伯、帶孫子阿嬤與小朋友 NPC
                const uncle = createLowPolyPerson({ shirtColor: 0xffffff, pantsColor: 0x334155, waveArm: true });
                uncle.position.set(-3.2, 0, -1.2);
                const grandma = createLowPolyPerson({ shirtColor: 0xc084fc, pantsColor: 0x334155 });
                grandma.position.set(2.0, 0, -0.5);
                const kid = createLowPolyPerson({ shirtColor: 0xfbbf24, isChild: true });
                kid.position.set(3.5, 0, 0.8);
                sceneGroup.add(uncle, grandma, kid);

                sceneGroup.add(createLowPolyTree(-8, -5, 1.1));
                sceneGroup.add(createLowPolyTree(8.5, -5.5, 1.2));

            } else if (sceneKey === 'award') {
                // --- 場景 6：五關全破結算頒獎台（導覽員阿凱登場） ---
                cameraAngle = { theta: 0, phi: 0.28, radius: 13.5, targetY: 2.2 };
                updateCameraPosition();

                scene.background = new THREE.Color(0xfef3c7);
                scene.fog = new THREE.FogExp2(0xfef3c7, 0.015);

                const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0xfde68a }));
                floor.rotation.x = -Math.PI / 2;
                sceneGroup.add(floor);

                // 榮譽頒獎台
                const podium = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.6, 0.8, 24), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
                podium.position.set(0, 0.4, 0);
                sceneGroup.add(podium);

                const banner = new THREE.Mesh(
                    new THREE.BoxGeometry(7.2, 1.6, 0.3),
                    new THREE.MeshLambertMaterial({ map: createSignTexture("🏆 獨立生活認證完成！", "#d97706", "#ffffff", "#fef3c7", "陽光社區榮譽榜") })
                );
                banner.position.set(0, 4.8, -3.2);
                sceneGroup.add(banner);

                // 導覽員阿凱與學長德哥一起鼓掌慶祝
                const aKai = createLowPolyPerson({ shirtColor: 0x10b981, pantsColor: 0x1e293b, waveArm: true });
                aKai.position.set(-1.1, 0.8, 0.2);
                aKai.scale.set(1.15, 1.15, 1.15);

                const deGe = createLowPolyPerson({ shirtColor: 0x0ea5e9, pantsColor: 0x334155, waveArm: true });
                deGe.position.set(1.1, 0.8, 0.2);
                deGe.scale.set(1.15, 1.15, 1.15);

                sceneGroup.add(aKai, deGe);
            }
        }

        // 動畫主循環
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // 角色親切呼吸起伏與揮手動畫
            animatedCharacters.forEach((char, idx) => {
                char.position.y = (char.userData.baseY || 0) + Math.sin(t * 2.5 + idx) * 0.04;
                if (char.userData.waveArm && char.userData.rightArmPivot) {
                    char.userData.rightArmPivot.rotation.z = 2.35 + Math.sin(t * 5 + idx) * 0.28;
                }
            });

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // 處理左側 3D 建築直接點擊互動（第一關街道場所辨識）
        function handle3DBuildingClick(buildingId) {
            if (gameState.currentStep !== 2 || gameState.isLocked) return;
            const stepData = GAME_STEPS[2];
            const optIndex = stepData.options.findIndex(o => o.id === buildingId);
            if (optIndex !== -1) {
                handleOptionSelect(optIndex);
            }
        }

        // =========================================================================
        // 6. UI 渲染與互動邏輯控制
        // =========================================================================
        function renderStagePills(currentStageIndex) {
            const container = document.getElementById('stage-pills');
            container.innerHTML = '';

            STAGES.forEach(st => {
                const isCurrent = st.id === currentStageIndex;
                const isDone = currentStageIndex > st.id;

                const pill = document.createElement('div');
                pill.className = `flex-shrink-0 px-3 py-1.5 rounded-full text-xs sm:text-sm font-black border-2 transition flex items-center gap-1 ${
                    isCurrent
                        ? 'bg-amber-500 text-white border-amber-600 shadow-sm scale-105'
                        : isDone
                            ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                            : 'bg-white text-slate-400 border-slate-200'
                }`;
                pill.innerHTML = `${isDone ? '✓ ' : ''}${st.short}`;
                container.appendChild(pill);
            });
        }

        function updateScoreDisplay(delta = 0) {
            const scoreEl = document.getElementById('score-display');
            scoreEl.textContent = gameState.score;

            if (delta !== 0) {
                const floatContainer = document.getElementById('score-float-container');
                const badge = document.createElement('div');
                const isPos = delta > 0;
                badge.className = `score-float px-2.5 py-1 rounded-xl font-black text-sm shadow-md border ${
                    isPos
                        ? 'bg-emerald-500 text-white border-emerald-300'
                        : 'bg-rose-500 text-white border-rose-300'
                }`;
                badge.textContent = isPos ? `+${delta} 分！` : `${delta} 分`;
                floatContainer.appendChild(badge);
                setTimeout(() => badge.remove(), 1250);
            }
        }

        function renderStep(stepIndex) {
            gameState.currentStep = stepIndex;
            const step = GAME_STEPS[stepIndex];

            // 切換 3D 場景
            build3DScene(step.sceneKey);

            // 更新左上角場所標籤與頂部進度膠囊
            document.getElementById('scene-title').textContent = step.sceneTitle;
            document.getElementById('scene-subtitle').textContent = step.sceneSubtitle;
            renderStagePills(step.stageIndex);

            // 隱藏回饋提示框
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('hidden');

            // 處理結算畫面動態評語（導覽員：阿凱）
            let npcTextToShow = step.npcText;
            let questionToShow = step.question;
            let speechQueue = "";

            if (step.isEnding) {
                const s = gameState.score;
                let rankTitle = "";
                let rankComment = "";
                if (s >= 90) {
                    rankTitle = "★★★ 社區生活大師（90～100 分）";
                    rankComment = "太強了！從超商、藥局、夜市、巷口麵店到社區公園，你全部都過關了！你不僅認識每個地方的功能，還會排隊、控制音量、愛護商品和環境，完全具備獨立生活的超強能力！";
                } else if (s >= 70) {
                    rankTitle = "★★ 社區探索達人（70～85 分）";
                    rankComment = "表現很棒喔！五個地方的任務你都順利完成了。只有一兩個小細節稍微扣分，記住『排隊不插隊、室內放輕聲、東西不亂拿、垃圾不亂丟』，下次一定拿滿分！";
                } else {
                    rankTitle = "★ 努力學習新星（65 分以下）";
                    rankComment = "辛苦啦！一次挑戰五個社區場所確實不簡單。我們再重新走一遍，仔細看看每個地方的提示，你一定會越來越厲害的！";
                }
                npcTextToShow = rankComment;
                questionToShow = `最終禮儀總分：${s} 分 ／ 獲得稱號：${rankTitle}`;
                speechQueue = `恭喜完成所有挑戰！你的最終分數是 ${s} 分，獲得 ${rankTitle}。阿凱說：${rankComment}`;
            } else {
                speechQueue = `${step.npcText}。題目：${step.question}`;
            }

            // 更新 NPC 對話與題目文字
            document.getElementById('npc-avatar-emoji').textContent = step.npcEmoji;
            document.getElementById('npc-name').textContent = step.npcName;
            document.getElementById('npc-role').textContent = step.npcRole;
            document.getElementById('npc-text').textContent = npcTextToShow;
            document.getElementById('scenario-badge').textContent = step.scenarioBadge;
            document.getElementById('question-title').textContent = questionToShow;

            // 學習模式提示框顯示控制
            const tipBox = document.getElementById('learning-tip-box');
            if (gameState.mode === 'learning' && step.tip) {
                tipBox.classList.remove('hidden');
                document.getElementById('learning-tip-text').textContent = step.tip;
            } else {
                tipBox.classList.add('hidden');
            }

            // 準備選項（挑戰模式下若有多個選項則隨機排序）
            let opts = step.options.map((o, idx) => ({ ...o, originalIndex: idx }));
            if (gameState.mode === 'challenge' && opts.length > 1) {
                opts = opts.sort(() => Math.random() - 0.5);
            }
            gameState.currentDisplayedOptions = opts;

            // 渲染大型高對比觸控選項按鈕（高度 >= 56px）
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            opts.forEach((opt, displayIdx) => {
                const btn = document.createElement('button');
                btn.id = `opt-btn-${displayIdx}`;
                btn.className = "option-btn w-full min-h-[60px] px-4 py-3.5 sm:px-5 sm:py-4 rounded-2xl border-2 border-slate-300 bg-white hover:bg-sky-50 hover:border-sky-500 text-left text-slate-900 font-bold text-base sm:text-lg leading-snug shadow-sm flex items-center justify-between gap-3";
                btn.innerHTML = `
                    <span class="flex-1">${opt.label}</span>
                    <span class="text-slate-400 text-xl flex-shrink-0">➔</span>
                `;
                btn.onclick = () => handleOptionSelect(displayIdx);
                optionsContainer.appendChild(btn);
            });

            // 滾動控制面板回頂部並自動語音朗讀
            document.getElementById('control-scroll-area').scrollTop = 0;
            speakText(speechQueue);
        }

        // 處理選項點擊（含 350ms 防連點機制與學習鷹架引導）
        function handleOptionSelect(displayIdx) {
            if (gameState.isLocked) return;

            // 啟動 350ms 防連點鎖定
            gameState.isLocked = true;
            setTimeout(() => {
                gameState.isLocked = false;
            }, 350);

            const step = GAME_STEPS[gameState.currentStep];
            const chosen = gameState.currentDisplayedOptions[displayIdx];
            if (!chosen) return;

            // 若是結算畫面的「再挑戰一次」
            if (step.isEnding) {
                playTapSound();
                resetGameData();
                renderStep(0);
                return;
            }

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackText = document.getElementById('feedback-text');
            const btnEl = document.getElementById(`opt-btn-${displayIdx}`);

            if (chosen.isCorrect) {
                // --- 答對處理 ---
                playSuccessSound();

                // 計算加分（10 題核心選擇題，每題答對 +10 分，最高上限 100 分）
                let actualDelta = 0;
                if (step.isScoredQuestion && !gameState.completedQuestions.has(step.questionNum)) {
                    gameState.completedQuestions.add(step.questionNum);
                    const prevScore = gameState.score;
                    gameState.score = Math.min(100, Math.max(0, gameState.score + chosen.delta));
                    actualDelta = gameState.score - prevScore;
                }
                updateScoreDisplay(actualDelta);

                // 按鈕視覺變為正向綠色
                if (btnEl) {
                    btnEl.classList.remove('border-slate-300', 'bg-white', 'hover:bg-sky-50');
                    btnEl.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-950');
                }

                // 若有覆蓋 NPC（例如第一關走對便利商店時的超商店員招呼）
                if (chosen.npcOverrideName) {
                    document.getElementById('npc-name').textContent = chosen.npcOverrideName;
                    document.getElementById('npc-avatar-emoji').textContent = chosen.npcOverrideEmoji || '🏪';
                    document.getElementById('npc-text').textContent = chosen.feedback;
                }

                // 顯示鼓勵回饋並提供「下一步」大按鈕（確保學生看清楚回饋再前進）
                feedbackBox.classList.remove('hidden', 'bg-rose-50', 'border-rose-300', 'text-rose-900');
                feedbackBox.classList.add('bg-emerald-50', 'border-emerald-400', 'text-emerald-950');
                feedbackIcon.textContent = '🎉';
                feedbackText.textContent = chosen.feedback;

                speakText(chosen.feedback);

                // 將選項區替換為單一大型「下一步」按鈕，防止誤觸並維持清晰學習節奏
                const optionsContainer = document.getElementById('options-container');
                const nextBtnLabel = chosen.nextStep === 14 ? "查看我的獨立生活認證成績 🏆" : "太棒了！前往下一步 ➔";
                optionsContainer.innerHTML = `
                    <button onclick="proceedToStep(${chosen.nextStep})"
                        class="option-btn w-full min-h-[64px] px-6 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl shadow-lg flex items-center justify-center gap-2">
                        <span>${nextBtnLabel}</span>
                    </button>
                `;

            } else {
                // --- 答錯處理（正向引導提示，扣分最低為 0，允許重新選擇直到選對） ---
                playGentleHintSound();

                let actualDelta = 0;
                if (chosen.delta < 0) {
                    const prevScore = gameState.score;
                    gameState.score = Math.max(0, gameState.score + chosen.delta);
                    actualDelta = gameState.score - prevScore;
                }
                updateScoreDisplay(actualDelta);

                // 標記此錯誤選項為柔和警示色並暫時禁用，引導重新選擇其他正確選項
                if (btnEl) {
                    btnEl.disabled = true;
                    btnEl.classList.remove('border-slate-300', 'bg-white', 'hover:bg-sky-50');
                    btnEl.classList.add('border-rose-300', 'bg-rose-50/70', 'text-rose-900');
                }

                // 在練習模式下，答錯後也顯示提示卡輔助思考
                if (gameState.mode === 'practice' && step.tip) {
                    const tipBox = document.getElementById('learning-tip-box');
                    tipBox.classList.remove('hidden');
                    document.getElementById('learning-tip-text').textContent = step.tip;
                }

                feedbackBox.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-400', 'text-emerald-950');
                feedbackBox.classList.add('bg-amber-50', 'border-amber-400', 'text-amber-950');
                feedbackIcon.textContent = '🤔';
                feedbackText.textContent = chosen.feedback;

                speakText(chosen.feedback);
            }
        }

        function proceedToStep(nextStepIndex) {
            if (gameState.isLocked) return;
            gameState.isLocked = true;
            setTimeout(() => { gameState.isLocked = false; }, 350);
            playTapSound();
            renderStep(nextStepIndex);
        }

        // =========================================================================
        // 7. 老師設定面板與懸浮功能按鈕控制
        // =========================================================================
        function toggleTeacherPanel() {
            playTapSound();
            const body = document.getElementById('teacher-panel-body');
            const arrow = document.getElementById('teacher-arrow');
            const isHidden = body.classList.contains('hidden');
            if (isHidden) {
                body.classList.remove('hidden');
                arrow.style.transform = 'rotate(90deg)';
            } else {
                body.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function setGameMode(newMode) {
            playTapSound();
            gameState.mode = newMode;

            const labels = {
                learning: { text: "學習模式", badgeClass: "bg-emerald-100 text-emerald-800 border-emerald-300" },
                practice: { text: "練習模式", badgeClass: "bg-sky-100 text-sky-800 border-sky-300" },
                challenge: { text: "挑戰模式", badgeClass: "bg-amber-100 text-amber-800 border-amber-300" }
            };

            const badge = document.getElementById('mode-badge');
            badge.textContent = labels[newMode].text;
            badge.className = `text-xs font-bold px-2.5 py-0.5 rounded-full border ${labels[newMode].badgeClass}`;

            ['learning', 'practice', 'challenge'].forEach(m => {
                const btn = document.getElementById(`mode-btn-${m}`);
                if (m === newMode) {
                    btn.className = "py-2 px-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition bg-slate-800 text-white border-slate-800";
                } else {
                    btn.className = "py-2 px-2 rounded-xl border-2 text-xs sm:text-sm font-bold transition bg-white text-slate-700 border-slate-300 hover:border-slate-400";
                }
            });

            // 立即重新渲染當前步驟以套用新模式
            renderStep(gameState.currentStep);
        }

        function jumpToStep(stepIdx) {
            playTapSound();
            renderStep(stepIdx);
        }

        function toggleMissionModal(show) {
            playTapSound();
            const modal = document.getElementById('mission-modal');
            if (show) {
                const step = GAME_STEPS[gameState.currentStep];
                const currentStage = STAGES.find(s => s.id === step.stageIndex);
                const content = document.getElementById('mission-modal-content');
                content.innerHTML = `
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4">
                        <div class="text-xs font-black text-amber-700 uppercase">目前任務目標</div>
                        <div class="text-lg font-black text-slate-900 mt-0.5">${currentStage ? currentStage.name : '陽光社區總認證'}</div>
                        <p class="text-slate-700 font-bold mt-1">${currentStage ? currentStage.mission : '完成五大社區場所考驗，拿到 80 分以上成為社區生活大師！'}</p>
                    </div>
                    <div class="space-y-2">
                        <div class="font-black text-slate-900">🌟 五大社區禮儀黃金守則：</div>
                        <ul class="space-y-1.5 text-sm sm:text-base font-bold text-slate-700">
                            <li class="flex items-center gap-2"><span class="text-emerald-600">✔</span> 1. 排隊不插隊，保持一個手臂的距離。</li>
                            <li class="flex items-center gap-2"><span class="text-emerald-600">✔</span> 2. 沒買的商品用眼睛看，不隨意拿取或拆封。</li>
                            <li class="flex items-center gap-2"><span class="text-emerald-600">✔</span> 3. 逛夜市靠邊排隊不擋路，拿飲料不摸商品。</li>
                            <li class="flex items-center gap-2"><span class="text-emerald-600">✔</span> 4. 餐廳內用放輕音量，餐具拿取適量不浪費。</li>
                            <li class="flex items-center gap-2"><span class="text-emerald-600">✔</span> 5. 公園垃圾要分類，禮讓兒童遊樂器材。</li>
                        </ul>
                    </div>
                `;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function toggleHomeModal(show) {
            playTapSound();
            const modal = document.getElementById('home-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function resetGameData() {
            gameState.score = 0;
            gameState.completedQuestions.clear();
            updateScoreDisplay(0);
        }

        function resetToHome() {
            playTapSound();
            toggleHomeModal(false);
            resetGameData();
            renderStep(0);
        }

        // =========================================================================
        // 8. 視窗載入啟動入口
        // =========================================================================
        window.onload = function () {
            initThreeJS();
            animate();
            // 預載語音列表
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
            renderStep(0);
        };
    </script>
</body>
</html>
